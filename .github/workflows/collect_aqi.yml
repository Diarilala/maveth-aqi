name: Hourly AQI collection

on:
  #schedule:
    #- cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch current AQI for all cities
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python3 src/collect_aqi.py

      - name: Commit and push new raw files
        run: |
          git config user.name "aqi-collector-bot"
          git config user.email "actions@github.com"
          git add raw/
          git diff --cached --quiet || git commit -m "Hourly AQI collection: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
